function prog(c){if(!c)return 1;let kind=c[2],goal=c[3],v=kind==='earn'?S.earned:kind==='belt'?S.machines.filter(m=>m.type==='belt').length:kind==='auto'?S.auto:kind==='power'?S.powerSec:kind==='machines'?S.machines.length:kind==='science'?S.science:(S.prod[kind]||0);return v/goal}function check(){let c=CONTRACTS[S.contract];if(c&&prog(c)>=1){S.cash+=c[4];toast('<b>CONTRACT COMPLETE</b><br>'+c[0]+' — +$'+fmt(c[4]),'gold');S.contract++;A.tone(660,.2,.07);setTimeout(()=>A.tone(880,.25,.06),80)}}
function ground(){g.fillStyle='#071019';g.fillRect(0,0,W,H);for(let s of stars){g.fillStyle='rgba(83,157,196,.13)';g.fillRect(s[0]*W,s[1]*H,s[2],s[2])}let a=world(0,0),b=world(W,H),x0=Math.floor(a[0]/T)-1,x1=Math.ceil(b[0]/T)+1,y0=Math.floor(a[1]/T)-1,y1=Math.ceil(b[1]/T)+1;for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){let q=scr(x*T,y*T),rr=res(x,y);g.fillStyle=(x+y)&1?'#0a1721':'#0c1b26';g.fillRect(q[0]-T*cam.z/2,q[1]-T*cam.z/2,T*cam.z+1,T*cam.z+1);g.strokeStyle='#173044';g.strokeRect(q[0]-T*cam.z/2,q[1]-T*cam.z/2,T*cam.z,T*cam.z);if(rr!=='dirt'){g.globalAlpha=.22;g.fillStyle=ITEMS[rr][1];for(let z=0;z<3;z++){let dx=((x*31+y*17+z*53)%45)-22,dy=((x*13+y*41+z*29)%43)-21;g.beginPath();g.arc(q[0]+dx*cam.z,q[1]+dy*cam.z,3*cam.z,0,7);g.fill()}g.globalAlpha=1}}}
function machine(m,ghost=0){let q=scr(m.x*T,m.y*T),z=cam.z,s=T*z*.78,c=M[m.type][4];g.save();g.translate(q[0],q[1]);g.rotate(m.d*Math.PI/2);g.globalAlpha=ghost?.45:1;g.shadowBlur=ghost?0:12*z;g.shadowColor=c+'55';g.fillStyle='#08131c';g.beginPath();g.roundRect(-s/2,-s/2,s,s,8*z);g.fill();g.shadowBlur=0;g.strokeStyle=c;g.lineWidth=2*z;g.stroke();g.fillStyle=c+'2d';g.fillRect(-s*.35,-s*.35,s*.7,s*.7);g.strokeStyle=c;g.fillStyle=c;g.lineWidth=2*z;let t=m.type;if(t==='belt'){g.strokeRect(-18*z,-10*z,36*z,20*z);for(let x=-12;x<13;x+=8){g.beginPath();g.moveTo(x*z,-7*z);g.lineTo((x+5)*z,0);g.lineTo(x*z,7*z);g.stroke()}}else if(t==='miner'||t==='manualMiner'){g.beginPath();g.moveTo(-13*z,14*z);g.lineTo(0,-14*z);g.lineTo(13*z,14*z);g.stroke();g.beginPath();g.arc(0,3*z,7*z,0,7);g.stroke()}else if(t==='seller'||t==='manualSeller'){g.font=`900 ${22*z}px system-ui`;g.textAlign='center';g.textBaseline='middle';g.fillText('$',0,0)}else if(t==='furnace'){g.beginPath();g.moveTo(0,-15*z);g.bezierCurveTo(15*z,0,12*z,15*z,0,15*z);g.bezierCurveTo(-12*z,15*z,-15*z,0,0,-15*z);g.fill()}else if(t==='press'){g.fillRect(-12*z,-12*z,24*z,7*z);g.fillRect(-5*z,-5*z,10*z,13*z);g.fillRect(-16*z,8*z,32*z,5*z)}else if(t==='assembler'){g.beginPath();g.arc(0,0,14*z,0,7);g.stroke();g.beginPath();g.arc(0,0,5*z,0,7);g.fill()}else if(t==='splitter'){g.beginPath();g.moveTo(-16*z,0);g.lineTo(14*z,0);g.moveTo(0,0);g.lineTo(14*z,-13*z);g.moveTo(0,0);g.lineTo(14*z,13*z);g.stroke()}else if(t==='merger'){g.beginPath();g.moveTo(-14*z,-13*z);g.lineTo(0,0);g.moveTo(-14*z,13*z);g.lineTo(0,0);g.moveTo(-14*z,0);g.lineTo(15*z,0);g.stroke()}else if(t==='storage'){g.strokeRect(-15*z,-12*z,30*z,24*z);g.beginPath();g.moveTo(-15*z,-3*z);g.lineTo(15*z,-3*z);g.stroke()}else if(t==='generator'){for(let a=0;a<3;a++){g.rotate(2.094);g.beginPath();g.ellipse(8*z,0,12*z,5*z,0,0,7);g.stroke()}}else if(t==='solar'){for(let y=-1;y<2;y++)for(let x=-1;x<2;x++)g.strokeRect((x*10-4)*z,(y*9-4)*z,8*z,7*z)}else if(t==='lab'){g.beginPath();g.moveTo(-7*z,-16*z);g.lineTo(-7*z,-2*z);g.lineTo(-14*z,15*z);g.lineTo(14*z,15*z);g.lineTo(7*z,-2*z);g.lineTo(7*z,-16*z);g.stroke()}else if(t==='booster'){g.beginPath();g.arc(0,0,15*z,0,7);g.stroke();g.fillRect(-2*z,-18*z,4*z,36*z);g.fillRect(-18*z,-2*z,36*z,4*z)}g.beginPath();g.moveTo(21*z,0);g.lineTo(14*z,-5*z);g.lineTo(14*z,5*z);g.fill();g.restore()}
function drawItems(){for(let i of S.items){let q=scr(i.x,i.y),r=7*cam.z;g.shadowBlur=8*cam.z;g.shadowColor=ITEMS[i.type][1];g.fillStyle=ITEMS[i.type][1];g.fillRect(q[0]-r,q[1]-r,r*2,r*2);g.shadowBlur=0}}function player(){let q=scr(p.x,p.y),z=cam.z;g.fillStyle='#07131c';g.beginPath();g.ellipse(q[0],q[1]+16*z,14*z,5*z,0,0,7);g.fill();g.fillStyle='#dbe9f2';g.beginPath();g.arc(q[0],q[1]-3*z,13*z,0,7);g.fill();g.fillStyle='#64d8ff';g.fillRect(q[0]-9*z,q[1]+8*z,18*z,15*z);g.fillStyle='#0a1822';g.fillRect(q[0]-7*z,q[1]-6*z,14*z,6*z);g.fillStyle='#ff5c69';g.beginPath();g.arc(q[0],q[1]-18*z,2*z,0,7);g.fill()}function particles(dt){for(let k=parts.length-1;k>=0;k--){let p=parts[k];p.l-=dt;if(p.l<=0){parts.splice(k,1);continue}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=90*dt;let q=scr(p.x,p.y);g.globalAlpha=cl(p.l/.8,0,1);g.fillStyle=p.c;g.fillRect(q[0],q[1],p.s*cam.z,p.s*cam.z)}g.globalAlpha=1}
function update(dt){S.time+=dt;S.stats.play+=dt;let x=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),y=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),l=Math.hypot(x,y)||1;p.vx=lp(p.vx,x/l*245,1-Math.pow(.001,dt));p.vy=lp(p.vy,y/l*245,1-Math.pow(.001,dt));p.x+=p.vx*dt;p.y+=p.vy*dt;cam.x=lp(cam.x,p.x,.055);cam.y=lp(cam.y,p.y,.055);machines(dt);items(dt);check();A.music();hud()}function draw(dt){ground();for(let m of S.machines)machine(m);drawItems();player();particles(dt);if(mode){machine({type:sel,x:mouse.gx,y:mouse.gy,d:rot},1);let q=scr(mouse.gx*T,mouse.gy*T);g.strokeStyle=!mAt(mouse.gx,mouse.gy)&&S.cash>=price(sel)?'#67f5a2':'#ff6176';g.lineWidth=2;g.strokeRect(q[0]-T*cam.z/2+2,q[1]-T*cam.z/2+2,T*cam.z-4,T*cam.z-4)}}function loop(t){let dt=Math.min(.05,(t-last)/1000);last=t;update(dt);draw(dt);requestAnimationFrame(loop)}requestAnimationFrame(loop);
function hud(){let P=power();$('#cash').textContent=fmt(S.cash);$('#science').textContent=fmt(S.science);$('#power').textContent=fmt(P.use)+' / '+fmt(P.gen);$('#power').style.color=P.ok?'':'#ff6176';let c=CONTRACTS[S.contract];$('#contract').innerHTML=c?`<b>CONTRACT ${S.contract+1}: ${c[0]}</b><br>${c[1]}<div class="bar"><i style="width:${cl(prog(c)*100,0,100)}%"></i></div><small>Reward: $${fmt(c[4])}</small>`:'<b>ALL CONTRACTS COMPLETE</b><br>The factory has escaped supervision.'}function build(force){mode=force!==undefined?force:!mode;$('#buildbar').classList.toggle('hidden',!mode);$('#mode').textContent=mode?'BUILD MODE — '+M[sel][0].toUpperCase():'EXPLORE';$('#buildBtn').textContent=mode?'EXPLORE [B]':'BUILD [B]';bar()}function bar(){let e=$('#buildbar');e.innerHTML='';for(let id in M){let m=M[id],d=document.createElement('div');d.className='bi '+(id===sel?'sel ':'')+(!unlock(id)?'lock':'');d.style.setProperty('--c',m[4]);d.innerHTML=`<div class="icon"></div><small>${m[0]}</small><em>$${fmt(price(id))}</em>`;d.onclick=()=>{if(unlock(id)){sel=id;bar();$('#mode').textContent='BUILD MODE — '+m[0].toUpperCase();A.tone(420)}};e.append(d)}}
function close(){for(let q of $$('.modal'))q.classList.add('hidden')}window.closeFactory=close;function shop(){close();let cats=[...new Set(Object.values(M).map(x=>x[1]))],h='<button class="close" onclick="closeFactory()">✕</button><h1>FACTORY SUPPLY</h1><div class="sub">The old shop grew up. Pick equipment, then place it in Build Mode.</div>';for(let cat of cats){h+=`<h3>${cat}</h3><div class="grid">`;for(let id in M){let m=M[id];if(m[1]!==cat)continue;h+=`<div class="card ${unlock(id)?'':'tech locked'}"><span class="tag">${cat}</span><h3>${m[0]}</h3><p>${m[5]}</p><span class="price">$${fmt(price(id))}</span><br><button data-buy="${id}" ${unlock(id)?'':'disabled'}>${unlock(id)?'SELECT FOR BUILD':'RESEARCH REQUIRED'}</button></div>`}h+='</div>'}$('#shop').innerHTML=h;$('#shop').classList.remove('hidden');$$('[data-buy]').forEach(b=>b.onclick=()=>{sel=b.dataset.buy;close();build(1)})}function research(){close();let h='<button class="close" onclick="closeFactory()">✕</button><h1>RESEARCH NETWORK</h1><div class="sub">Science ◈ '+fmt(S.science)+' — automate Research Labs to generate more.</div><div class="grid">';for(let id in TECH){let t=TECH[id],done=tech(id),ok=t[3].every(tech);h+=`<div class="card tech ${done?'done':ok?'available':'locked'}"><span class="tag">TECHNOLOGY</span><h3>${t[0]}</h3><p>${t[2]}</p><span class="price">${done?'✓ RESEARCHED':'◈ '+t[1]}</span>${!done&&ok?`<br><button data-tech="${id}">RESEARCH</button>`:''}</div>`}h+='</div>';$('#research').innerHTML=h;$('#research').classList.remove('hidden');$$('[data-tech]').forEach(b=>b.onclick=()=>{let id=b.dataset.tech,t=TECH[id];if(S.science>=t[1]){S.science-=t[1];S.tech[id]=1;toast('<b>RESEARCH COMPLETE</b><br>'+t[0],'green');A.tone(660,.2,.07);research();bar();save()}else toast('<b>Need more Science.</b>')})}function stats(){close();let P=power(),r=[['Total Earned','$'+fmt(S.earned)],['Items Sold',fmt(S.stats.sold)],['Machines',S.machines.length],['World Items',S.items.length],['Auto-Sold',fmt(S.auto)],['Science',fmt(S.science)],['Grid',P.use+' / '+P.gen],['Play Time',Math.floor(S.stats.play/60)+'m'],['Research',Object.keys(S.tech).filter(k=>S.tech[k]).length+'/'+Object.keys(TECH).length]];$('#stats').innerHTML='<button class="close" onclick="closeFactory()">✕</button><h1>FACTORY TELEMETRY</h1><div class="sub">Live production overview.</div><div class="stats">'+r.map(x=>`<div class="stat"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('')+'</div>';$('#stats').classList.remove('hidden')}function settings(){close();$('#settings').innerHTML=`<button class="close" onclick="closeFactory()">✕</button><h1>SETTINGS</h1><div class="setting"><span>Music</span><input id="mu" type="range" min="0" max="1" step=".01" value="${S.settings.music}"></div><div class="setting"><span>SFX</span><input id="sf" type="range" min="0" max="1" step=".01" value="${S.settings.sfx}"></div><div class="setting"><span>Particles</span><input id="pa" type="checkbox" ${S.settings.particles?'checked':''}></div><br><button id="sv">SAVE NOW</button> <button id="wipe">RESET SAVE</button>`;$('#settings').classList.remove('hidden');$('#mu').oninput=e=>{S.settings.music=+e.target.value;A.apply()};$('#sf').oninput=e=>{S.settings.sfx=+e.target.value;A.apply()};$('#pa').onchange=e=>S.settings.particles=e.target.checked;$('#sv').onclick=()=>{save();toast('<b>Saved.</b>','green')};$('#wipe').onclick=()=>{if(confirm('Erase the entire factory?')){localStorage.removeItem(KEY);location.reload()}}}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.repeat)return;let k=e.key.toLowerCase();if(k==='b'){close();build()}else if(k==='e')shop();else if(k==='r')research();else if(k==='q'&&mode){rot=(rot+1)%4;A.tone(350)}else if(k==='x'&&mode){let m=mAt(mouse.gx,mouse.gy);if(m)remove(m)}else if(k==='escape'){close();if(mode)build(0)}else if(k===' '){e.preventDefault();manual()}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);C.onpointermove=e=>{let q=world(e.clientX,e.clientY);mouse.x=e.clientX;mouse.y=e.clientY;mouse.gx=Math.round(q[0]/T);mouse.gy=Math.round(q[1]/T)};C.onpointerdown=e=>{if(mode){if(e.button===0)place(sel,mouse.gx,mouse.gy);if(e.button===2){let m=mAt(mouse.gx,mouse.gy);if(m)remove(m)}}else manual()};C.oncontextmenu=e=>e.preventDefault();C.onwheel=e=>{e.preventDefault();cam.z=cl(cam.z*Math.exp(-e.deltaY*.001),.45,1.8)};$('#buildBtn').onclick=()=>build();$('#shopBtn').onclick=shop;$('#researchBtn').onclick=research;$('#statsBtn').onclick=stats;$('#settingsBtn').onclick=settings;bar();hud();if(!S.machines.length){S.machines.push({id:1,type:'manualMiner',x:0,y:1,d:0,cool:0,prog:0,buf:[]},{id:2,type:'manualSeller',x:2,y:1,d:0,cool:0,prog:0,buf:[]});toast('<b>Your Scratch idea evolved.</b><br>Start manually. Then automate everything.','green')}
})();
